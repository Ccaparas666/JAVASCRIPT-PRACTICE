<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple E-Commerce</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f4f4;
}

/* Header */
header {
    background: #222;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.cart {
    font-size: 18px;
}

/* Product Grid */
.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 20px;
}

.product {
    background: white;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
}

.product img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

.product h3 {
    margin: 10px 0;
}

.product button {
    background: #28a745;
    color: white;
    border: none;
    padding: 10px;
    width: 100%;
    cursor: pointer;
    border-radius: 5px;
}

.product button:hover {
    background: #218838;
}

/* Cart */
.cart-box {
    background: white;
    margin: 20px;
    padding: 15px;
    border-radius: 8px;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}
</style>

</head>
<body>

<header>
    <h1>My Shop</h1>
    <div class="cart">
        🛒 Cart: <span id="cartCount">0</span>
    </div>
</header>

<section class="products">
    <div class="product">
        <img src="https://via.placeholder.com/300">
        <h3>T-Shirt</h3>
        <p>₱499sssssssssasdhgabsdkjaghsdasdjkasaskjagdaskjdgassss</p>
        <button onclick="addToCart('T-Shirt', 499)">Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/300">
        <h3>Shoesssssssssss test</h3>
        <p>₱1,999</p>
        <p>test fire</p>
        <button onclick="addToCart('Shoes', 1999)">Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/300">
        <h3>bag</h3>
        <p>₱899</p>
        <button onclick="addToCart('Bag', 899)">Add to Cart</button>
    </div>
</section>
sssss
<section class="cart-box">
    <h2>Cart Items</h2>
    <div id="cartItems"></div>
    <h3>Total: ₱<span id="totalPrice">0</span></h3>
</section>

<script>
let cart = [];
let total = 0;

function addToCart(name, price) {
    cart.push({ name, price });
    total += price;

    document.getElementById("cartCount").innerText = cart.length;
    document.getElementById("totalPrice").innerText = total;

    renderCart();
}

function renderCart() {
    const cartItems = document.getElementById("cartItems");
    cartItems.innerHTML = "";

    cart.forEach(item => {
        const div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML = `<span>${item.name}</span><span>₱${item.price}</span>`;
        cartItems.appendChild(div);
    });
}


function calculateTax(cost, texPercent) {
    console.log(cost * texPercent);
}

calculateTax(2000);
</script>

</body>
</html>
